
name: Deploy BrightSteps Haven

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: BrightSteps_Haven_Instagram_Facebook_Login_Both_Icons_Fixed/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: BrightSteps_Haven_Instagram_Facebook_Login_Both_Icons_Fixed/frontend
        run: npm ci

      - name: Build frontend
        working-directory: BrightSteps_Haven_Instagram_Facebook_Login_Both_Icons_Fixed/frontend
        run: npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: BrightSteps_Haven_Instagram_Facebook_Login_Both_Icons_Fixed/frontend/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4

